name: SPX AI export - volume alerts and Cboe freshness

on:
  push:
    branches: [main]
    paths:
      - 'ai_report.py'
      - 'ai_quality_export.py'
      - 'ai_replay.py'
      - 'acquisition_schedule.py'
      - 'gamma_replay.py'
      - 'volume_audit.py'
      - 'tests/test_ai_quality_export.py'
      - 'tests/test_ai_report_v10_zip.py'
      - '.github/workflows/ai-export-quality-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile AI report and original dependencies
        run: python -m compileall -q ai_quality_export.py ai_report.py ai_replay.py acquisition_schedule.py gamma_replay.py volume_audit.py vix_regime.py
      - name: Install application dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Verify volume alerts and source timestamp provenance
        run: python -m unittest discover -s tests -p 'test_ai_quality_export.py' -v
      - name: Render real PDF/ZIP and verify backwardation rule unchanged
        run: python -m unittest discover -s tests -p 'test_ai_report_v10_zip.py' -v
