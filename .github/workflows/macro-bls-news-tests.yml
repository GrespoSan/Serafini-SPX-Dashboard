name: SPX Macro News - public BLS BEA Census Fed ISM

on:
  push:
    branches: [main]
    paths:
      - 'macro_calendar.py'
      - 'bls_calendar.py'
      - 'gamma_section.py'
      - 'pine_news_overlay.py'
      - 'tests/test_macro_bls_dual_source.py'
      - 'tests/test_macro_calendar_auth.py'
      - 'tests/test_pine_news_overlay.py'
      - '.github/workflows/macro-bls-news-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile public-source news and Pine modules
        run: python -m compileall -q macro_calendar.py bls_calendar.py gamma_section.py pine_news_overlay.py
      - name: Install app dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Regression CPI November 10, provider outages, DST and source deduplication
        run: python -m unittest discover -s tests -p 'test_macro_bls_dual_source.py' -v
      - name: Verify public no-key sources and original Pine timestamps
        run: |
          python -m unittest discover -s tests -p 'test_macro_calendar_auth.py' -v
          python -m unittest discover -s tests -p 'test_pine_news_overlay.py' -v
      - name: Probe real BLS public schedule access (diagnostic only)
        continue-on-error: true
        run: |
          python - <<'PY'
          from datetime import date
          from bls_calendar import fetch_bls
          try:
              events = fetch_bls(date(2026,11,10), date(2026,11,13))
              cpi = [e for e in events if e["day"] == date(2026,11,10) and e["kind"] == "CPI"]
              print("BLS public access OK; CPI 10 Nov:", cpi)
              assert cpi and cpi[0]["clock"] == "14:30"
          except Exception as exc:
              print("BLS public access NOT VERIFIED", type(exc).__name__, str(exc)[:300])
              raise
          PY
