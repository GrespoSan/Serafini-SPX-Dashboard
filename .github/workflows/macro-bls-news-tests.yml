name: SPX Macro News - independent BLS and FinanceCalendar

on:
  push:
    branches: [main]
    paths:
      - 'macro_calendar.py'
      - 'bls_calendar.py'
      - 'gamma_section.py'
      - 'pine_news_overlay.py'
      - 'tests/test_macro_bls_dual_source.py'
      - 'tests/test_macro_calendar_auth.py'
      - 'tests/test_pine_news_overlay.py'
      - '.github/workflows/macro-bls-news-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile dual-source news and Pine modules
        run: python -m compileall -q macro_calendar.py bls_calendar.py gamma_section.py pine_news_overlay.py
      - name: Install app dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Regression CPI November 10, BLS/FC outage, DST and source conflicts
        run: python -m unittest discover -s tests -p 'test_macro_bls_dual_source.py' -v
      - name: Verify authenticated FinanceCalendar and original Pine timestamps
        run: |
          python -m unittest discover -s tests -p 'test_macro_calendar_auth.py' -v
          python -m unittest discover -s tests -p 'test_pine_news_overlay.py' -v
