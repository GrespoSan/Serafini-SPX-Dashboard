name: SPX Replay - Roma time axis regression

on:
  push:
    branches: [main]
    paths:
      - 'gamma_replay.py'
      - 'gamma_section.py'
      - 'pine_sources.py'
      - 'pine_compare.py'
      - 'tests/test_pine_compare.py'
      - 'replay_candles.py'
      - 'replay_prices.py'
      - 'replay_scale.py'
      - 'replay_profiles.py'
      - 'replay_view.py'
      - 'replay_gif.py'
      - 'tests/test_replay_candles_timeaxis.py'
      - 'tests/test_replay_scale.py'
      - 'tests/test_replay_profiles.py'
      - 'tests/test_replay_view.py'
      - 'tests/test_replay_gif_band.py'
      - 'tests/test_replay_plotly_bars.py'
      - 'tests/test_replay_price_sources.py'
      - '.github/workflows/replay-rome-time-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Replay modules without executing remote services
        run: python -m compileall -q gamma_replay.py gamma_section.py pine_sources.py pine_compare.py app.py replay_candles.py replay_prices.py replay_scale.py replay_profiles.py replay_view.py replay_gif.py
      - name: Install only test dependencies
        run: python -m pip install 'pandas>=2.1,<3' 'plotly>=5.20,<7' 'streamlit>=1.42,<2' 'yfinance>=0.2.50,<2'
      - name: Test Roma time axis and zero position
        run: |
          python -m unittest discover -s tests -p 'test_replay_candles_timeaxis.py' -v
          python -m unittest discover -s tests -p 'test_replay_scale.py' -v
          python -m unittest discover -s tests -p 'test_replay_price_sources.py' -v
          python -m unittest discover -s tests -p 'test_replay_profiles.py' -v
          python -m unittest discover -s tests -p 'test_replay_view.py' -v
          python -m unittest discover -s tests -p 'test_replay_gif_band.py' -v
          python -m unittest discover -s tests -p 'test_replay_plotly_bars.py' -v
          python -m unittest discover -s tests -p 'test_pine_compare.py' -v
