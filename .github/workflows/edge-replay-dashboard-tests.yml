name: SPX GEX Edge Replay compare integration

on:
  push:
    branches: [main]
    paths:
      - 'edge_replay_data.py'
      - 'edge_replay_panel.py'
      - 'edge_triptych.py'
      - 'edge_latest_source.py'
      - 'edge_auto.py'
      - 'tests/test_edge_replay_data.py'
      - 'tests/test_edge_replay_chart.py'
      - 'tests/test_edge_metric_ui.py'
      - '.github/workflows/edge-replay-dashboard-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Edge Replay UI without accessing Cboe
        run: python -m compileall -q edge_replay_data.py edge_replay_panel.py edge_triptych.py edge_latest_source.py edge_auto.py
      - name: Install independent test dependencies
        run: python -m pip install --quiet "plotly>=5.20,<7" "streamlit>=1.42,<2" "pandas>=2.1,<3" "yfinance>=0.2.50,<2" "requests>=2.31,<3"
      - name: Verify provenance and strict same-day comparisons
        run: |
          python -m unittest discover -s tests -p 'test_edge_replay_data.py' -v
          python -m unittest discover -s tests -p 'test_edge_replay_chart.py' -v
          python -m unittest discover -s tests -p 'test_edge_metric_ui.py' -v
