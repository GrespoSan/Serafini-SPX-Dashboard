name: SPX offline import regression tests
on:
  push:
    paths:
      - app.py
      - emergency_pine.py
      - pine_export.py
      - offline_snapshot.py
      - macro_calendar.py
      - gamma_section.py
      - edge_auto_engine.py
      - edge_gex_exposure.py
      - edge_auto.py
      - edge_triptych.py
      - tests/test_edge_gex_exposure.py
      - manual_acquisition.py
      - tests/test_offline_snapshot.py
      - tests/test_emergency_pine.py
      - tests/test_macro_calendar_auth.py
      - tests/test_spx_layout_parity.py
      - tests/test_snapshot_selection.py
      - .github/workflows/spx-offline-import-tests.yml
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal runtime for macro calendar test
        run: python -m pip install -q "streamlit>=1.42,<2"
      - name: Compile dashboard and offline importer
        run: python -m py_compile app.py gamma_section.py manual_acquisition.py offline_snapshot.py macro_calendar.py emergency_pine.py pine_export.py edge_auto_engine.py edge_gex_exposure.py edge_auto.py edge_triptych.py
      - name: Test offline import without credentials
        run: python -m unittest discover -s tests -p 'test_offline_snapshot.py' -v
      - name: Test emergency one-snapshot current Pine without Supabase
        run: python -m unittest discover -s tests -p 'test_emergency_pine.py' -v
      - name: Test FinanceCalendar authentication without secrets
        run: python -m unittest discover -s tests -p 'test_macro_calendar_auth.py' -v
      - name: Test full-chain Edge GEX sign and Call/Put NET/Gross reconciliation
        run: python -m unittest discover -s tests -p 'test_edge_gex_exposure.py' -v
      - name: Test SPX-only layout and Supabase 402 fallback
        run: python -m unittest discover -s tests -p 'test_spx_layout_parity.py' -v
      - name: Test latest CBOE automatic follow and manual history
        run: python -m unittest discover -s tests -p 'test_snapshot_selection.py' -v
