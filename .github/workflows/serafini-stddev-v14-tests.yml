name: Serafini SPX — StdDev RTH Pine v1.4 regression

on:
  push:
    paths:
      - serafini_sigma.py
      - gamma_section.py
      - tests/test_serafini_sigma.py
      - .github/workflows/serafini-stddev-v14-tests.yml
  pull_request:
    paths:
      - serafini_sigma.py
      - gamma_section.py
      - tests/test_serafini_sigma.py
      - .github/workflows/serafini-stddev-v14-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sigma:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: python -m pip install -q "streamlit>=1.42,<2" "plotly>=5.20,<7" "pandas>=2.1,<3" "yfinance>=0.2.50,<2"
      - name: Compile sigma and chart integration
        run: python -m py_compile serafini_sigma.py gamma_section.py
      - name: Test correct 350/90 stdev, close at 15:15 and no look-ahead
        run: python -m unittest discover -s tests -p 'test_serafini_sigma.py' -v
