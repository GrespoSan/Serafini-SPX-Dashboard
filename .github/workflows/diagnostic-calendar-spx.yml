name: Diagnostic only - SPX calendar API
on:
  push:
    paths:
      - .github/workflows/diagnostic-calendar-spx.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only Streamlit (no app credentials)
        run: python -m pip install -q 'streamlit>=1.42,<2'
      - name: Probe exact calendar code and parsed data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.error import HTTPError, URLError
          from datetime import date
          from macro_calendar import _fetch, _prepare, _kind, _rome_time
          first, last = '2026-11-01', '2026-11-09'
          print('TEST: public FinanceCalendar, date range', first, last)
          try:
              rows = _fetch(first, last)
              print('FETCH_SUCCESS; raw rows:', len(rows))
              examples = [{k: x.get(k) for k in ('date','name','title','series_code','time_utc','time_et','country','status')} for x in rows[:4]]
              print('SOURCE_SAMPLE', json.dumps(examples, ensure_ascii=False))
              parsed = _prepare(rows, date(2026,11,2))
              print('PREPARED_COUNT', len(parsed))
              print('PREPARED_SAMPLE', json.dumps(parsed[:6], ensure_ascii=False, default=str))
          except HTTPError as e:
              print('HTTP_ERROR', e.code, e.reason, 'URL:', e.url)
              print('ERROR_BODY', e.read(1000).decode('utf8','replace'))
          except URLError as e:
              print('NETWORK_ERROR', type(e.reason).__name__, str(e.reason)[:300])
          except Exception as e:
              print('PARSE_OR_CONFIG_ERROR', type(e).__name__, str(e)[:1200])
          PY
