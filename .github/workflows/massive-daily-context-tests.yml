name: Serafini SPX · Massive Daily context regression

on:
  push:
    branches: [main]
    paths:
      - "massive_futures_daily.py"
      - "daily_volatility.py"
      - "vix_regime.py"
      - "tests/test_previous_es_daily_change.py"
      - ".github/workflows/massive-daily-context-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_context:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies for the Daily context
        run: python -m pip install "streamlit>=1.42,<2" "requests>=2.31,<3"
      - name: Compile changed Python sources
        run: python -m py_compile massive_futures_daily.py daily_volatility.py vix_regime.py
      - name: Assert Massive Close/Close differs from settlement when appropriate
        run: python -m unittest discover -s tests -p "test_previous_es_daily_change.py" -v
