name: MARKET MAP — Pine generator regression tests
on:
  pull_request:
    paths:
      - 'market_map_pine_autogen.py'
      - 'pine_export.py'
      - 'pine_compare.py'
      - 'pine_gex_overlay.py'
      - 'pine_gex_sources.py'
      - 'pine_sources.py'
      - 'acquisition_schedule.py'
      - 'gamma_replay.py'
      - 'gamma_section.py'
      - 'tests/test_slot_1616_1746_chicago.py'
      - 'emergency_pine.py'
      - 'tests/test_pine_gex_style.py'
      - 'pine_news_overlay.py'
      - 'tests/test_market_map_pine_autogen.py'
      - 'tests/test_pine_text_size.py'
      - '.github/workflows/test-market-map-pine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_market_map_pine_autogen.py' -v
      - run: python -m unittest discover -s tests -p 'test_pine_text_size.py' -v
      - run: python -m unittest discover -s tests -p 'test_pine_compare.py' -v
      - run: python -m unittest discover -s tests -p 'test_pine_gex_style.py' -v
      - run: python -m unittest discover -s tests -p 'test_emergency_pine.py' -v
      - run: python -m unittest discover -s tests -p 'test_slot_1616_1746_chicago.py' -v
