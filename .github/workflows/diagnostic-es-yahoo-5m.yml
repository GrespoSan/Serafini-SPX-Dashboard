name: DIAGNOSTIC - Yahoo ES 5m candles (no write)

on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnostic-es-yahoo-5m.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostics
        run: python -m pip install 'yfinance>=0.2.50,<2' 'pandas>=2.1,<3' 'streamlit>=1.42,<2'
      - name: Inspect exact Yahoo OHLC in Roma timezone, no data mutation
        run: |
          python - <<'PY'
          from datetime import date
          from zoneinfo import ZoneInfo
          import yfinance as yf
          import pandas as pd
          import numpy as np
          from replay_prices import load_es_candles
          day=date(2026,11,9)
          print('Inspecting Yahoo ES=F 5m for', day, 'Europe/Rome', flush=True)
          try:
              data=load_es_candles.__wrapped__(day)
          except AttributeError:
              data=load_es_candles(day)
          if data is None or data.empty:
              print('EMPTY YAHOO DATA')
              raise SystemExit(1)
          print('BARS',len(data),'MAX_CLOSE',data.bar_close.max(),flush=True)
          window=data[(data.bar_close.dt.strftime('%H:%M')>='11:15') & (data.bar_close.dt.strftime('%H:%M')<='12:30')]
          for _,row in window.iterrows():
              print('OHLC', row.bar_close.isoformat(),*[f'{row[k]:.2f}' for k in ['open','high','low','close']])
          diffs=data['open'].sub(data['close'].shift(1)).abs()
          ranges=(data.high-data.low)
          for ix in diffs.nlargest(8).index:
              row=data.loc[ix]
              print('GAP_RANK', row.bar_close.isoformat(), 'OPEN',row.open,'HIGH',row.high,
                    'LOW',row.low,'CLOSE',row.close,'GAP',float(diffs.loc[ix]),
                    'RANGE',float(ranges.loc[ix]))
          PY
