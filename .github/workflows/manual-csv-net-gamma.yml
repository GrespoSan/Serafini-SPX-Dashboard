name: SPX independent manual CSV NET GAMMA
on:
  pull_request:
    paths:
      - 'app.py'
      - 'manual_csv/**'
      - 'tests/test_manual_csv_net_gamma.py'
      - '.github/workflows/manual-csv-net-gamma.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q manual_csv
      - run: python -m unittest discover -s tests -p test_manual_csv_net_gamma.py -v
